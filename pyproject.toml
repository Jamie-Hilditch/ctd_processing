[project]
name = "ctd-processing"
version = "0.1.0"
description = "Process RBR CTD data files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flox>=0.9.0",
    "gsw>=3.6.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "profinder>=0.2.5",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.15.0",
    "pyrsktools>=1.3.0",
    "tomli-w>=1.0.0",
    "typer>=0.27.1",
    "xarray>=2024.9.0",
    "zarr>=2.18.0",
]

[project.scripts]
ctd-processing = "ctd_processing.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["tests/example_data"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_example_data: needs tests/example_data/ (real .rsk files, not checked into git)",
]

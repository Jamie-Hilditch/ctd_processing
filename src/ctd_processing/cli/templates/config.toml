# ctd_processing configuration file
#
# Written by `ctd-processing init`, which sets [project] and [paths]
# from its --name, --rsk-directory, --profiles-directory, and
# --binned-directory options (see `ctd-processing init --help`). Pass
# this file to the `process`, `bin`, and `concatenate` commands via
# `--config path/to/config.toml`. Individual options can also be
# overridden on the command line with `--set section.key=value`
# (repeatable), without editing this file.
#
# Relative paths in this file (e.g. paths.rsk_directory) are resolved
# relative to the directory containing this config.toml file, not the
# current working directory.
#
# [instruments.<serial_number>] and [deployments.<stem>] sections (see
# below) let you override [process] settings for one specific instrument
# or deployment. Where more than one applies, [deployments.*] wins over
# [instruments.*], which wins over [process].
#
# `process` is still a stub pending the real pyrsktools/gsw-based
# implementation.

[project]

# name (default: "my_ctd_processing_project"): a human-readable name
# for this project. Attached to every output file's metadata.
# name = "my_ctd_processing_project"

[paths]

# rsk_directory (required, no default): directory containing the raw
# .rsk deployment files to process. If relative, resolved against the
# directory containing this config.toml file. `process --target NAME`
# resolves NAME relative to this directory; with no --target, every
# top-level *.rsk file directly inside it is processed.
# rsk_directory = "rsk_files"

# profiles_directory (required, no default): directory for profile
# files extracted from rsk_directory deployments. Resolved the same
# way as rsk_directory.
# profiles_directory = "profiles"

# binned_directory (required, no default): directory for pressure or
# depth-binned profile files produced from profiles_directory. Resolved
# the same way as rsk_directory. `concatenate --target NAME` resolves
# NAME to NAME.<ext> in this directory (<ext> matching bin.output_format);
# with no --target, every top-level file with that extension is
# concatenated.
# binned_directory = "binned"

# concatenated_file (optional, default: unset): file `concatenate`
# writes its single, deduplicated, time-ordered CF-compliant netCDF
# output to. If relative, resolved the same way as rsk_directory. Unlike
# every other path here, there is no valid "do nothing" behavior for
# concatenate with this unset -- it must be set before running
# concatenate.
# concatenated_file = "concatenated.nc"

# log_file (optional, default: unset): file to write log records below
# ERROR level to. If relative, resolved the same way as rsk_directory.
# Unset means no such file is written.
# log_file = "ctd_processing.log"

# error_log_file (optional, default: unset): file to write log records
# at ERROR level and above to. Resolved the same way as log_file.
# error_log_file = "ctd_processing.error.log"

# read_channels (optional, default: []): restrict which channels are
# extracted from a deployment's raw .rsk data to exactly these RBR
# channel names -- the names the data is actually saved under on the
# instrument (e.g. "temperature", "conductivity"), NOT the short
# post-processing keys used in [process.raw_channels.<name>] below (e.g.
# RBR's "conductivity" becomes the key "electrical_conductivity" there).
# Applied while reading the .rsk file, before any other processing step,
# so an excluded channel is never read into memory at all. If a
# requested channel is not present in the deployment (unrecognized, or
# reported by the instrument but not logged in this schedule), that is
# an error, not a silent skip. Left unset (the default empty list),
# every channel with data present is extracted.
# [process]
# read_channels = ["temperature", "conductivity", "sea_pressure"]

# [process.raw_channels.<name>] sections are optional and configure
# per-channel processing of the *raw* channels built from a deployment's
# .rsk data. <name> is the short identifier a channel is stored under in
# the built dataset -- e.g. "temperature" -- not the raw
# pyrsktools field name and not the full CF standard_name. A channel with
# no section here just uses the defaults below. Section names depend on
# which channels your instrument reports; the example below is
# illustrative, not required.
#
# [process.raw_channels.temperature]
#
# remove_holds (default: true): remove "held" (repeated-value) stretches
# from this channel's data before further processing.
# remove_holds = true
#
# shift (optional, default: unset): number of samples to shift this
# channel's data by, e.g. to correct a known sensor response lag relative
# to the other channels. Follows pandas' Series.shift(periods=shift)
# convention: positive delays the channel (each sample takes the value
# from `shift` samples earlier, leaving the first `shift` samples as NaN);
# negative advances it (each sample takes the value from abs(shift)
# samples later, leaving the last abs(shift) samples as NaN). Applied
# after remove_holds and before offset. Unset means no shift is applied.
# shift = 0
#
# offset (optional, default: unset): a fixed offset to add to this
# channel's data, e.g. to correct a known calibration bias. Applied after
# remove_holds/shift. Unset means no offset is applied.
# offset = 0.0

# [process] settings not scoped to a single raw channel.

# atmospheric_pressure (optional, default: unset): constant atmospheric
# pressure, in dbar, subtracted from the absolute_pressure channel to
# (re)compute sea_pressure, overwriting any sea_pressure channel already
# present. Unset (the default) means the dataset's own sea_pressure
# channel is trusted and used as-is instead -- RBR's Ruskin software
# commonly derives sea_pressure itself from absolute_pressure and a
# per-deployment atmospheric reference before the .rsk file is even
# read, so there is normally nothing to recompute. With this left unset,
# it is an error for a deployment to have no sea_pressure channel at
# all. Set this to force a specific atmospheric pressure instead, e.g.
# ``10.1325`` for the standard atmosphere.
# [process]
# atmospheric_pressure = 10.1325

# profile_format (default: "parquet"): file format for extracted profile
# files written to profiles_directory. "parquet" (default) is compressed
# per [process.parquet_compression] below, plus byte-stream-split
# encoding for float columns -- the better fit for this fast,
# size-sensitive intermediate stage. "netcdf" writes CF-compliant files
# (units/long_name/standard_name as variable attributes,
# project/deployment metadata and processing history as global
# attributes) via xarray + h5netcdf, compressed per
# [process.netcdf_compression] below -- better for long-term
# self-description and interop with CF-aware tools (ERDDAP, OceanSITES,
# etc.).
# profile_format = "parquet"

# output_dtype (default: "float32"): project-wide default numpy
# floating-point dtype every channel is cast to when written, unless
# overridden by that channel's own output_dtype in
# [process.channels.<name>] below. Must be a floating dtype.
# output_dtype = "float32"

# [process.netcdf_compression] configures zlib compression for
# floating-point variables when profile_format = "netcdf". Ignored when
# profile_format = "parquet". Shared with [bin.netcdf_compression] below
# (same settings, same effect) since both write netCDF via xarray +
# h5netcdf. The time coordinate is always left uncompressed regardless
# of these settings.
#
# enabled (default: true): compress floating-point variables at all.
# false writes fully uncompressed netCDF files.
#
# complevel (default: 4): zlib compression level, 0 (fastest, no
# compression) to 9 (slowest, most compression).
#
# shuffle (default: true): apply HDF5's shuffle filter before
# compressing -- typically improves compression for floats at
# negligible cost.
# [process.netcdf_compression]
# enabled = true
# complevel = 4
# shuffle = true

# [process.parquet_compression] configures zstd compression when
# profile_format = "parquet". Ignored when profile_format = "netcdf".
# Byte-stream-split encoding for float columns is unaffected by
# `enabled` -- it is a column-encoding transform, independent of the
# zstd codec choice.
#
# enabled (default: true): zstd-compress at all. false writes with
# compression="none".
#
# level (optional, default: unset): zstd compression level, 1 (fastest,
# least compression) to 22 (slowest, most compression). Unset (the
# default) means pyarrow's/zstd's own default level.
# [process.parquet_compression]
# enabled = true
# level = 3

# [process.profiles] configures identifying individual profiles (casts)
# from the sea_pressure channel via the `profinder` package. All fields
# are optional; the defaults below are profinder's own and are tuned for
# a multi-hundred-dbar oceanic deployment -- re-tune peak_height,
# peak_distance, peak_width, and peak_prominence to your deployment's
# depth range and sampling rate.
#
# [process.profiles]

# apply_smoothing (default: false): apply Savitzky-Golay smoothing to
# the pressure record before detecting profiles.
# apply_smoothing = false

# window_length (default: 9): Savitzky-Golay window length, in samples.
# Only used if apply_smoothing is true.
# window_length = 9

# polyorder (default: 2): Savitzky-Golay polynomial order. Only used if
# apply_smoothing is true.
# polyorder = 2

# min_pressure (default: -1.0): a profile must start and end at a sea
# pressure greater than this value, in dbar, to be considered a real,
# in-water profile.
# min_pressure = -1.0

# peak_height, peak_distance, peak_width, peak_prominence: minimum
# height (dbar), distance (samples), width (samples), and prominence
# (dbar) for a cast turnaround (maximum pressure) to be detected as a
# peak. Forwarded to scipy.signal.find_peaks.
# peak_height = 25.0
# peak_distance = 200
# peak_width = 200
# peak_prominence = 25.0

# trough_prominence, trough_distance, trough_width: minimum prominence
# (dbar), distance (samples), and width (samples) for a surface point
# (a trough in sea pressure) to be detected. Forwarded to
# scipy.signal.find_peaks.
# trough_prominence = 2.0
# trough_distance = 5
# trough_width = 5

# run_length (default: 4): number of consecutive samples of consistent
# pressure change required to confirm a real descent/ascent, guarding
# against noise.
# run_length = 4

# min_pressure_change (default: 0.01): minimum pressure change, in
# dbar, between consecutive samples for run_length's consistency check.
# min_pressure_change = 0.01

# apply_speed_threshold (default: false): additionally require a
# minimum profiling speed (computed from sea pressure and time), rather
# than relying only on peak/trough detection.
# apply_speed_threshold = false

# min_speed (default: 0.2): minimum profiling speed, in dbar/s,
# required when apply_speed_threshold is true.
# min_speed = 0.2

# speed_threshold_direction (default: "both"): only relevant when
# apply_speed_threshold is true. The downcast and upcast of every
# turnaround are always both identified regardless of this setting; it
# only controls which of them gets its boundary refined by the
# min_speed check. One of "up", "down", "both". Independent of
# direction below, which controls which cast(s) are written out as
# separate profiles.
# speed_threshold_direction = "both"

# direction (default: "down"): which cast direction(s) to write out as
# separate profiles. "down"/"up" extracts only the downcast/upcast of
# each identified turnaround; "both" extracts the downcast and upcast
# as two separate profiles. The dwell between a turnaround's downcast
# and upcast is never included in an extracted profile. One of "up",
# "down", "both".
# direction = "down"

# missing (default: "drop"): how to handle non-finite values in the
# pressure record. "raise" raises an error; "drop" drops them before
# detection. Defaults to "drop" (not profinder's own "raise" default)
# since sea_pressure routinely has NaNs from upstream remove_holds
# processing.
# missing = "drop"

# [process.ct_lag] configures the conductivity/temperature (CT) lag
# correction: shifting the electrical_conductivity channel by a
# small number of samples relative to temperature to reduce
# salinity spiking caused by the two sensors' slightly different response
# times. A single shift is calculated for the whole deployment (not one
# per profile) by grid-searching candidate lags and picking the one that
# minimizes high-pass-filtered salinity variance, pooled across every
# identified profile (see [process.profiles] above -- this runs after
# profiles are identified).
#
# [process.ct_lag]

# enabled (default: false): whether to calculate and apply this
# correction. To apply a known, fixed shift instead of calculating one,
# set shift under [process.raw_channels.electrical_conductivity]
# directly rather than enabling this.
# enabled = false

# sea_pressure_min, sea_pressure_max (optional, default: unset): restrict
# the lag search to samples whose sea_pressure, in dbar, falls within
# this range. Unset means no bound on that side. Useful for excluding
# unreliable near-surface measurements or sections with highly variable
# profiling speed.
# sea_pressure_min = 1.0
# sea_pressure_max = 500.0

# window_length (default: 21): width, in samples, of the running-mean
# high-pass filter used to isolate salinity spiking when scoring a
# candidate lag. Must be odd.
# window_length = 21

# min_lag, max_lag (default: -20, 20): inclusive range of candidate lags,
# in samples, to search over. min_lag must be <= max_lag.
# min_lag = -20
# max_lag = 20

# [process.geolocation] attaches a position to every extracted profile,
# evaluated at the profile's start time (its "canonical" time). Unlike
# every other [process.*] section on this page, this one is REQUIRED --
# process does not validate without it. Configure exactly one of the two
# mutually exclusive options below.
#
# [process.geolocation]

# Option 1: interpolate from an external netCDF position time series.
#
# external_dataset_path (no default): path to a netCDF file holding a
# latitude/longitude time series. Resolved the same way as rsk_directory
# when relative. Raises an error if a profile's canonical time falls
# outside this dataset's time coverage, rather than guessing.
# external_dataset_path = "gps_track.nc"
#
# latitude_variable, longitude_variable, time_variable (defaults:
# "latitude", "longitude", "time"): variable names to read from
# external_dataset_path. latitude_variable/longitude_variable must share
# their dimension with time_variable.
# latitude_variable = "latitude"
# longitude_variable = "longitude"
# time_variable = "time"

# Option 2: a fixed reference position, used for every profile.
#
# reference_latitude, reference_longitude (no default): a fixed position,
# in decimal degrees north/east, used for every profile instead of an
# external dataset. Must be set together.
# reference_latitude = 45.0
# reference_longitude = -125.0

# [process.derived_variables] configures which TEOS-10 derived variables
# (computed via gsw) are attached to each profile, right after a position
# has been attached to it (see [process.geolocation] above) and before it
# is written out. Every quantity is derived from the profile's
# electrical_conductivity, temperature, and
# sea_pressure channels, plus its latitude/longitude. Disabling a field
# only omits that channel from the output -- the underlying practical/
# absolute salinity and conservative temperature chain is always computed
# internally regardless, since later quantities depend on it. A channel
# already present under one of these keys (e.g. an instrument's own
# onboard-computed practical_salinity/absolute_salinity/density_anomaly)
# is overwritten, since the recomputed value incorporates whatever
# upstream raw-channel/CT-lag corrections were applied.
#
# [process.derived_variables]

# z (default: true): height, in meters (negative in the ocean), added
# under the channel key "z".
# z = true

# practical_salinity (default: true): practical salinity, added under
# "practical_salinity".
# practical_salinity = true

# absolute_salinity (default: true): absolute salinity, added under
# "absolute_salinity".
# absolute_salinity = true

# conservative_temperature (default: true): conservative temperature,
# added under "conservative_temperature".
# conservative_temperature = true

# potential_density (default: true): potential density anomaly
# referenced to 0 dbar (sigma0), added under "density_anomaly".
# potential_density = true

# potential_temperature (default: false): potential temperature
# referenced to 0 dbar, added under "potential_temperature".
# potential_temperature = false

# sound_speed (default: false): speed of sound in sea water, added
# under "speed_of_sound".
# sound_speed = false

# density (default: false): in-situ density, added under
# "sea_water_density".
# density = false

# spiciness (default: false): spiciness referenced to 0 dbar, added
# under "spiciness". No CF standard name exists for this quantity.
# spiciness = false

# freezing_point (default: false): Conservative Temperature at which
# seawater freezes, added under "freezing_point". No CF standard name
# exists for this quantity.
# freezing_point = false

# thermal_expansion (default: false): thermal expansion coefficient,
# added under "thermal_expansion_coefficient". No CF standard name
# exists for this quantity.
# thermal_expansion = false

# haline_contraction (default: false): haline contraction coefficient,
# added under "haline_contraction_coefficient". No CF standard name
# exists for this quantity.
# haline_contraction = false

# oxygen_concentration (default: false): oxygen concentration derived
# from a measured dissolved_oxygen_saturation channel and the oxygen
# solubility at 100% air-sea equilibrium, added under
# "oxygen_concentration_from_saturation". Unlike every other field
# above, this one's input isn't present on every dataset -- if enabled
# and the dataset has no dissolved_oxygen_saturation channel, an error
# is raised rather than silently skipping it.
# oxygen_concentration = false

# [process.despiking] sets the project-wide default despike settings --
# how many MAD-based (median absolute deviation) spread units of the
# residual against a rolling median count as a spike, how wide that
# rolling median's window is, and how many detect-and-replace passes to
# run at most (stopping early the first pass that finds nothing new).
# Spikes are always replaced with NaN. These are only defaults: whether a
# given channel is despiked at all is configured per channel, in
# [process.channels.<name>] below -- setting values here alone despikes
# nothing.
#
# [process.despiking]

# threshold (default: 3.0): number of MAD-based spread units a point's
# residual against the rolling median must exceed to be flagged.
# threshold = 3.0

# window_length (default: 3): width, in samples, of the rolling median
# filter. Must be odd.
# window_length = 3

# iterations (default: 1): maximum number of detect-and-replace passes
# to run. Because the MAD-based spread isn't inflated by the spikes it's
# measuring, a single pass usually already catches everything; this
# mostly exists as an escape valve for unusual data.
# iterations = 1

# [process.channels.<name>] sections are optional and configure
# per-channel output settings: despiking and output precision. <name>
# uses the same key namespace as [process.raw_channels.<name>] above:
# raw channels (e.g. "temperature") and derived-variable channels (e.g.
# "practical_salinity", matching [process.derived_variables]'s output
# keys) share one namespace. A channel with no section here is not
# despiked and is written in output_dtype's project-wide default below.
#
# despike (default: false): whether to despike this channel, using
# [process.despiking]'s project-wide defaults, as overridden by this
# channel's own despiking table below (if any). Despiking runs as soon
# as a channel exists -- for raw channels, before any derived variable
# is computed from them; for derived channels, immediately after that
# quantity is computed and before it feeds the next one (e.g.
# practical_salinity is despiked before it's used to compute
# absolute_salinity).
#
# [process.channels.temperature]
# despike = true
#
# despiking (optional): overrides threshold/window_length/iterations from
# [process.despiking] for just this channel (any field left out inherits
# the project-wide default). Only takes effect when despike is true
# above -- setting this alone, without despike = true, does nothing.
#
# [process.channels.practical_salinity]
# despike = true
#
# [process.channels.practical_salinity.despiking]
# threshold = 4.0

# output_dtype (optional, default: unset, meaning use [process]'s
# project-wide output_dtype below): the numpy floating-point dtype
# (e.g. "float32", "float64") this channel's data is cast to when
# written. Must be a floating dtype.
#
# [process.channels.z]
# output_dtype = "float64"

# [bin] configures the `bin` command, which reads back every profile file
# for one deployment, bins each profile's channels onto a common grid
# along one channel (default "z"), averages every other channel within
# each bin, and stacks the results along a new "profile" dimension into
# one combined dataset written to paths.binned_directory.
#
# [bin]

# channel (default: "z"): the channel key to bin by. Any key valid in a
# profile's channels, e.g. "z" (height, meters, negative in the ocean) or
# "sea_pressure".
# channel = "z"

# step (default: 1.0): bin edge spacing, in channel's units. May be
# negative for a decreasing grid, e.g. binning a downcast by "z" (which
# decreases with depth). Must not be 0.
# step = 1.0

# first, last (optional, default: unset): the first bin edge, and the
# edge to reach or pass. Edges are generated as first, first + step,
# first + 2*step, ..., stopping at the first edge that reaches or passes
# last -- unlike numpy.arange, the final bin may slightly overshoot last.
# If unset, first/last are computed from the data actually being binned:
# with step > 0, first defaults to the minimum and last to the maximum of
# channel across every profile being binned; with step < 0, the reverse.
# last must be on the correct side of first for step's sign (last >=
# first when step > 0; last <= first when step < 0).
# first = -500.0
# last = 0.0

# output_format (default: "netcdf"): file format for the combined,
# binned dataset. "netcdf" writes a CF-compliant file via xarray +
# h5netcdf, matching process.profile_format's "netcdf" option and
# compressed per [bin.netcdf_compression] below. "zarr" writes a Zarr
# store instead, compressed per [bin.zarr_compression] below.
# output_format = "netcdf"

# [bin.netcdf_compression] configures zlib compression for
# floating-point variables when output_format = "netcdf". Ignored when
# output_format = "zarr". Same settings/effect as
# [process.netcdf_compression] above. Every coordinate is always left
# uncompressed.
# [bin.netcdf_compression]
# enabled = true
# complevel = 4
# shuffle = true

# [bin.zarr_compression] configures Blosc compression for
# floating-point variables when output_format = "zarr". Ignored when
# output_format = "netcdf". Every coordinate is always left
# uncompressed.
#
# enabled (default: true): compress floating-point variables at all.
# false writes with no compressor at all (zarr's raw bytes codec only).
#
# cname (default: "zstd"): the Blosc-internal codec. One of "blosclz",
# "lz4", "lz4hc", "snappy", "zlib", "zstd".
#
# clevel (default: 5): Blosc compression level, 0 (fastest, no
# compression) to 9 (slowest, most compression).
#
# shuffle (optional, default: unset): byte-shuffle filter applied
# before compressing. One of "noshuffle", "shuffle", "bitshuffle".
# Unset means BloscCodec picks automatically based on each variable's
# dtype.
# [bin.zarr_compression]
# enabled = true
# cname = "zstd"
# clevel = 5
# shuffle = "shuffle"

# [instruments.<serial_number>] sections are optional and override
# [process] settings for one specific instrument, identified by its
# serial number, across every deployment it appears in. <serial_number>
# is read from the .rsk file itself when a deployment is processed --
# never inferred from a filename -- so it only needs to match the real
# instrument serial number, not any particular file. Only the fields
# given here are overridden; everything else falls back to [process]
# above. Nested tables (raw_channels.<name>, profiles) merge field by
# field, not as a whole table. The example below is illustrative, not
# required.
#
# [instruments.208532.process]
# atmospheric_pressure = 10.1
#
# [instruments.208532.process.raw_channels.temperature]
# shift = 2

# [deployments.<stem>] sections are optional and override [process] (and
# any matching [instruments.*]) settings for one specific deployment,
# where <stem> is that deployment's .rsk filename without the extension,
# e.g. "243188_20260809_0304" for 243188_20260809_0304.rsk. Merges the
# same way as [instruments.*], and wins over it when both set the same
# field. The example below is illustrative, not required.
#
# [deployments.243188_20260809_0304.process]
# atmospheric_pressure = 10.1325
